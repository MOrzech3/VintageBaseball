<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Red Sox Vintage: Topps & Bowman 1950–1965</title>
  <meta name="description" content="A personal checklist of Red Sox Topps and Bowman baseball cards from 1950 to 1965.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="masthead">
      <h1 class="title">Red Sox Vintage</h1>
      <p class="subtitle">Every Red Sox card Topps and Bowman printed, 1950 to 1965</p>
    </header>

    <section class="board-panel" aria-labelledby="board-heading">
      <h2 id="board-heading" class="sr-only">Collection scoreboard</h2>
      <div class="board-scroll">
        <table class="board" id="board"></table>
      </div>
      <p class="board-summary" id="board-summary"></p>
    </section>

    <div class="toolbar">
      <label class="search">
        <span class="sr-only">Find a player</span>
        <input type="search" id="search" placeholder="Find a player across every set" autocomplete="off">
      </label>
      <div class="actions">
        <button type="button" class="btn" id="print-btn">Print want list</button>
        <button type="button" class="btn" id="export-btn">Back up</button>
        <button type="button" class="btn" id="import-btn">Restore</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </div>

    <main id="main" class="main" tabindex="-1"></main>

    <footer class="footer">
      <p>Your collection is saved in this browser. Use Back up to save a copy you can restore on another device.</p>
    </footer>
  </div>

  <div class="print-area" id="print-area" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
